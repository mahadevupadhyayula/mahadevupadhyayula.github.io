name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_WORKFLOW_INQUIRY_ENDPOINT: ${{ vars.VITE_WORKFLOW_INQUIRY_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Write public frontend config override
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          endpoint = os.environ.get('VITE_WORKFLOW_INQUIRY_ENDPOINT', '').strip()
          if endpoint:
              Path('_data').mkdir(exist_ok=True)
              Path('_data/env.json').write_text(
                  json.dumps({'workflow_inquiry_endpoint': endpoint}, indent=2) + '\n',
                  encoding='utf-8'
              )
          else:
              Path('_data/env.json').unlink(missing_ok=True)
              print('Using committed _data/env.yml workflow endpoint.')
          PY

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
